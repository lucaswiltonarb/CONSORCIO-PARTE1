<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - PROMPT MESTRE</title>
    <link href="/assets/plugins/global/plugins.bundle.css" rel="stylesheet">
    <link href="/assets/css/style.bundle.css" rel="stylesheet">
</head>
<body class="bg-dark">
    <div class="d-flex flex-column flex-center min-vh-100 px-5">
        <div class="text-center mb-8">
            <span class="text-white fs-2x fw-bolder">PROMPT<span class="text-primary">MESTRE</span></span>
            <div class="text-gray-500 fs-6 mt-2">Inteligência comercial para consórcios</div>
        </div>
        <div class="card w-100" style="max-width:420px">
            <div class="card-body p-8">
                <h1 class="fs-3 mb-6">Acessar plataforma</h1>
                <form id="login-form">
                    <div class="mb-4">
                        <label class="form-label">E-mail</label>
                        <input type="email" id="email" data-testid="login-email" class="form-control" required>
                    </div>
                    <div class="mb-6">
                        <label class="form-label">Senha</label>
                        <input type="password" id="password" data-testid="login-password" class="form-control" required>
                    </div>
                    <div id="erro" data-testid="login-error" class="alert alert-danger d-none"></div>
                    <button type="submit" data-testid="login-submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const erro = document.getElementById('erro');
            erro.classList.add('d-none');
            try {
                const data = await api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                localStorage.setItem(TOKEN_KEY, data.token);
                localStorage.setItem(USER_KEY, JSON.stringify(data.user));
                window.location.href = '/dashboard.html';
            } catch (err) {
                erro.textContent = err.message;
                erro.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
